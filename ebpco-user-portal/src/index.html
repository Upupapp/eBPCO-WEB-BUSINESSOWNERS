<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>eBPCO Citizen Portal</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The Municipality of Castilla, Sorsogon seal, as real icons generated from
       logo.png (which is 603 KB and 778x721 — too heavy to be the tab icon
       itself). favicon.ico was the Angular CLI placeholder until 19 Sep 2026;
       browsers that fall back to /favicon.ico showed the Angular logo. -->
  <link rel="icon" href="/favicon.ico?v=2" sizes="48x48">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!--
    F-8: no third-party font host. Gothic A1 is bundled in src/fonts.scss and
    served from this origin. Do not reintroduce a fonts.googleapis.com or
    fonts.gstatic.com link here: it discloses every visitor's IP address and
    user-agent to Google before the page renders, which this portal's privacy
    notice does not authorise.
  -->
  <link rel="preload" href="/assets/fonts/gothic-a1-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Must load before the Angular bundle: sets globalThis.EBPCO_API_BASE_URL, read by core/api/api-config.ts. -->
  <script src="config.js"></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
