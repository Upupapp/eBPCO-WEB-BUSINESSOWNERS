<div class="ds-shell">
  <aside class="ds-sidenav">
    <div class="ds-brand">
      <img src="logo.png" alt="Municipality of Castilla seal" class="ds-brand-seal" />
      <span class="ds-brand-title">eBPCO Portal</span>
    </div>
    <div class="ds-brand-rule"></div>

    <nav class="ds-nav" aria-label="Primary">
      <a class="ds-nav-link" routerLink="/dashboard" routerLinkActive="active">
        <svg class="ds-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 11 12 4l8 7" />
          <path d="M6 10v9a1 1 0 0 0 1 1h3v-5h4v5h3a1 1 0 0 0 1-1v-9" />
        </svg>
        <span>Home</span>
      </a>
      <a class="ds-nav-link" routerLink="/businesses" routerLinkActive="active">
        <svg class="ds-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9 5 4h14l1 5" />
          <path d="M4 9a2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0" />
          <path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9" />
          <path d="M9 20v-5h6v5" />
        </svg>
        <span>Businesses</span>
      </a>
      <a class="ds-nav-link" routerLink="/permits" routerLinkActive="active">
        <svg class="ds-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 3h7l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" />
          <path d="M14 3v4h4" />
          <path d="M9 13h6" />
          <path d="M9 17h6" />
        </svg>
        <span>Permit Services</span>
      </a>
      <a class="ds-nav-link" routerLink="/applications" routerLinkActive="active">
        <svg class="ds-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1Z" />
          <path d="M6 6h12a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1Z" />
          <path d="m8.5 12.5 1.5 1.5 3-3" />
        </svg>
        <span>My Applications</span>
      </a>
      <a class="ds-nav-link" routerLink="/documents" routerLinkActive="active">
        <svg class="ds-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 6a1 1 0 0 1 1-1h4l2 2h8a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6Z" />
        </svg>
        <span>My Documents</span>
      </a>
      <a class="ds-nav-link" routerLink="/payments" routerLinkActive="active">
        <svg class="ds-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="6" width="18" height="13" rx="2" />
          <path d="M3 10h18" />
          <path d="M7 15h4" />
        </svg>
        <span>Payments</span>
      </a>
      <a class="ds-nav-link" routerLink="/notifications" routerLinkActive="active">
        <svg class="ds-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 9a6 6 0 0 1 12 0c0 4 1.5 5.5 2 6H4c.5-.5 2-2 2-6Z" />
          <path d="M10 19a2 2 0 0 0 4 0" />
        </svg>
        <span>Notifications</span>
        @if (notifications.unreadCount() > 0) {
          <span class="badge badge-red ds-nav-badge">{{ notifications.unreadCount() }}</span>
        }
      </a>
      <a class="ds-nav-link" routerLink="/profile" routerLinkActive="active">
        <svg class="ds-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8" r="3.4" />
          <path d="M5.5 20a6.5 6.5 0 0 1 13 0" />
        </svg>
        <span>Profile</span>
      </a>
      <a class="ds-nav-link" routerLink="/help" routerLinkActive="active">
        <svg class="ds-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M9.6 9.2a2.4 2.4 0 1 1 3.4 2.2c-.9.5-1.4 1-1.4 2" />
          <path d="M12 17h.01" />
        </svg>
        <span>Help &amp; Support</span>
      </a>
    </nav>

    <hr class="ds-divider" />
    <button type="button" class="ds-nav-link ds-logout" (click)="logout()">
      <svg class="ds-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3" />
        <path d="m15 16 4-4-4-4" />
        <path d="M19 12H9" />
      </svg>
      <span>Log Out</span>
    </button>
  </aside>

  <div class="ds-main">
    <div class="ds-topbar">
      <span class="ds-topbar-name">{{ userName() }}</span>
      <span class="ds-topbar-avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="3.4" />
          <path d="M5.5 20a6.5 6.5 0 0 1 13 0" />
        </svg>
      </span>
    </div>
    <router-outlet />
  </div>
</div>
<app-toast-host />
