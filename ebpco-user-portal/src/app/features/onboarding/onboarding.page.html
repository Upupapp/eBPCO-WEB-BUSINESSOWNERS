<div class="ob-page">
  <!-- Decorative background — purely presentational, never intercepts input. -->
  <div class="ob-decor" aria-hidden="true">
    <svg class="ob-decor-building" viewBox="0 0 240 170" preserveAspectRatio="xMidYMax meet" focusable="false">
      <path
        fill="currentColor"
        d="M0 160h240v10H0v-10Zm14-6V88h14v66H14Zm26 0V72h14v82H40Zm26 0V88h14v66H66Zm26 0V60h14v94H92Zm26 0V88h14v66h-14Zm26 0V72h14v82h-14Zm26 0V88h14v66h-14ZM6 88 120 26l114 62H6Zm104-52h20v14h-20V36Z"
      />
    </svg>
    <div class="ob-decor-dots"></div>
    <div class="ob-decor-wave ob-decor-wave-1"></div>
    <div class="ob-decor-wave ob-decor-wave-2"></div>
  </div>

  <button
    type="button"
    class="ob-skip"
    [style.visibility]="isLast() ? 'hidden' : 'visible'"
    [attr.tabindex]="isLast() ? -1 : 0"
    (click)="finish()"
  >
    Skip
  </button>

  <div class="ob-content">
    <div class="ob-hero">
      <span class="ob-orbit-aura" aria-hidden="true"></span>
      <span class="ob-orbit-ring ob-orbit-ring-outer" aria-hidden="true"></span>
      <span class="ob-orbit-ring ob-orbit-ring-inner" aria-hidden="true"></span>
      <span class="ob-orbit-dot ob-orbit-dot-1" aria-hidden="true"></span>
      <span class="ob-orbit-dot ob-orbit-dot-2" aria-hidden="true"></span>
      <span class="ob-orbit-dot ob-orbit-dot-3" aria-hidden="true"></span>
      <span class="ob-orbit-dot ob-orbit-dot-4" aria-hidden="true"></span>

      <div class="ob-icon-chip ob-icon-chip-doc" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 3h7l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" />
          <path d="M14 3v4h4" />
          <path d="M9 13h6" />
          <path d="M9 17h6" />
        </svg>
      </div>
      <div class="ob-icon-chip ob-icon-chip-gov" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 21h16" />
          <path d="M5 21V10l7-5 7 5v11" />
          <path d="M9 21v-6h6v6" />
          <path d="M9 10h.01M12 10h.01M15 10h.01" />
        </svg>
      </div>
      <div class="ob-icon-chip ob-icon-chip-phone" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path
            d="M6.6 10.8c1.3 2.6 3.5 4.7 6 6l2-2c.3-.3.7-.4 1.1-.3 1.2.4 2.5.6 3.8.6.6 0 1 .5 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.9c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.3 1.1l-2 2Z"
          />
        </svg>
      </div>
      <div class="ob-icon-chip ob-icon-chip-checklist" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1Z" />
          <path d="M6 6h12a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1Z" />
          <path d="m8.5 12.5 1.5 1.5 3-3" />
          <path d="m8.5 17 1.5 1.5 3-3" />
        </svg>
      </div>

      <div class="ob-seal-base">
        <img src="logo.png" alt="Municipality of Castilla seal" class="ob-seal" />
      </div>
    </div>

    <div class="onboarding-track ob-track" [style.transform]="'translateX(-' + index() * 100 + '%)'">
      @for (slide of slides; track slide.titleLine1; let i = $index) {
        <div class="onboarding-slide ob-slide">
          <h1 class="ob-heading">
            <span class="ob-heading-line" [class.anim-fade-rise]="i === index()">{{ slide.titleLine1 }}</span>
            <span class="ob-heading-accent" [class.anim-fade-rise]="i === index()" style="animation-delay: 0.06s">{{
              slide.titleAccent
            }}</span>
          </h1>
          <p class="ob-desc" [class.anim-fade-rise]="i === index()" style="animation-delay: 0.14s">{{ slide.body }}</p>
        </div>
      }
    </div>

    <div class="onboarding-dots ob-dots">
      @for (slide of slides; track slide.titleLine1; let i = $index) {
        <span class="onboarding-dot" [class.active]="i === index()"></span>
      }
    </div>
  </div>

  <button type="button" class="ob-cta" (click)="isLast() ? finish() : next()">
    <span>{{ isLast() ? 'Get Started' : 'Next' }}</span>
    <svg
      class="ob-cta-arrow"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M5 12h14" />
      <path d="m13 6 6 6-6 6" />
    </svg>
  </button>
</div>
