[build]
  base    = "ebpco-user-portal"
  # `npm run build` now runs `write-runtime-config.mjs` first (see
  # package.json) — it writes `public/config.js` from EBPCO_API_BASE_URL,
  # which is set in `[build.environment]` below. Left unset, the build ships
  # a same-origin default, and every API call then hits THIS site's own
  # origin and gets a 404 HTML page back (see the comment on the variable).
  command = "npm run build"
  publish = "dist/ebpco-user-portal/browser"

[build.environment]
  NODE_VERSION = "22"
  # The a11y gate (npm run check:a11y) needs Playwright, which downloads ~300MB
  # of browsers on postinstall. Netlify runs `npm run build`, NOT `npm run
  # verify`, so it never needs them - this keeps that download off every deploy.
  # Remove this only if the deploy is ever changed to run the gate.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

  # ── Where the API is ─────────────────────────────────────────────────────
  #
  # Until 19 Sep 2026 this was unset, so `public/config.js` shipped
  # `EBPCO_API_BASE_URL = ""` and `CitizenApiClient` sent every request to
  # https://fastidious-chimera-7a7a18.netlify.app/... — this site's OWN
  # origin — where Netlify answered with a 404 HTML page. The API was never
  # asked.
  #
  # Now it is the API's real origin: the Linode at 139.162.51.165, running the
  # Compose stack in the backend repo's `apps/ebpco-api/deploy/`. The hostname
  # is sslip.io wildcard DNS — the IP spelled with dashes — because the LGU has
  # no domain for it yet; Let's Encrypt issues for it and Caddy on that host
  # holds the certificate. When a real hostname exists, change it HERE, in
  # `deploy/.env` (API_HOST) on the Linode, and in the admin portal's
  # netlify.toml — the three must agree.
  #
  # Kept in this file rather than Netlify's UI so the value is reviewable and
  # arrives with the code that needs it. Scheme + host, no trailing slash.
  #
  # The API's CORS allowlist for this site is USER_PORTAL_BASE_URL on its
  # side (security.ts), set to https://fastidious-chimera-7a7a18.netlify.app.
  # If this site ever moves, that changes too, or every request fails in the
  # browser console with a CORS error and nothing in the API's logs.
  EBPCO_API_BASE_URL = "https://139-162-51-165.sslip.io"

# ── There is a real API now, reached CROSS-ORIGIN, not through this file ──
#
# This site never proxies `/auth/*`, `/me`, `/applications` and so on to the
# API — there is deliberately no redirect rule for any of them here.
# `CitizenApiClient` calls `API_BASE_URL` (from `public/config.js`, written
# at build time by `write-runtime-config.mjs` from EBPCO_API_BASE_URL in
# `[build.environment]` above) directly, which is an ABSOLUTE URL on the
# API's own origin, never a same-origin path on this Netlify site. The API's
# own CORS policy (`security.ts`, backend repo) is what allows this site's
# real deployed origin to call it — that origin is exactly
# `USER_PORTAL_BASE_URL` on the API side, and the two have to be kept in
# agreement.
#
# This used to be a set of same-origin proxy redirects to `/index.html` with
# `status = 404` for most API paths, PLUS a documented, unsolved problem for
# four of them (`/applications`, `/documents`, `/notifications`,
# `/businesses`) that are simultaneously API path prefixes and this app's own
# page routes — Netlify's declarative [[redirects]] cannot tell an XHR from a
# browser navigation to the same path, so there was no rule that could 404
# one without 404ing the other. The cross-origin path above resolves that
# for free: none of these paths are ever requested from THIS site's own
# origin in the first place, so there is nothing left for Netlify to
# disambiguate. A same-origin gateway remains a legitimate choice (leave
# EBPCO_API_BASE_URL unset, and put a real reverse proxy in front of both
# this site and the API, with something that CAN read the Accept header in
# front of it for those four paths) — it just is not what this repository
# ships redirect rules for.

# Angular routes on the client. Without this every deep link — /login,
# /applications, /businesses — is a 404 on refresh or when opened directly,
# because no file exists at that path. 200 rather than 301: the URL the
# citizen sees must not change.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security headers ──────────────────────────────────────────────────────
#
# Nothing here before this: Netlify's own defaults ship none of these. This
# is a citizen-facing portal that handles real applicant PII behind a real
# login, so the gap was not cosmetic.
[[headers]]
  for = "/*"
  [headers.values]
    # No external script/style/font host: this app is fully self-contained
    # (checked against src/index.html — no third-party <script>/<link> tags).
    # `style-src` keeps 'unsafe-inline' for Angular's per-component <style>
    # tags, which this build (optimization disabled for "production" in
    # angular.json) emits without a nonce or hash to pin them to instead.
    # `connect-src` is 'self' plus the real API origin, since
    # CitizenApiClient calls it cross-origin (see EBPCO_API_BASE_URL above)
    # — everything else this app talks to is itself. The generated permit's
    # verification QR is drawn to a <canvas> from a locally-built URL string
    # (permit-document.page.ts); nothing is fetched to produce it.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://139-162-51-165.sslip.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    # A year, subdomains included. No `preload`: that is a one-way submission
    # to browsers' built-in preload list and a human call, not a default.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    # Belt-and-suspenders with frame-ancestors above, for browsers that only
    # honour the older header.
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # No camera/mic/geolocation/USB anywhere in this app.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), usb=()"
